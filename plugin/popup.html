<html>
<head>
  <title>Your Extension</title>
  <script src="jquery.min.js"></script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="width: 400px;">
    <div class="container">
        <div class="container">
          <!-- Your extension content goes here -->
          <div class="row">
              <div class="col-12" >
                <div class="row">
                    <div class="col-2">
    
                        <span>  <img src="logo.jpg"  width="60" height="60"/></span>  
                    </div>
                    <div class="col-10 mt-auto mb-auto">
                        <h4 style="margin-bottom: 0">Concisafe</h4>
                        <span style="font-style: oblique; font-size: 12px;">Unleash the world of pure content</span>
                    </div>

                </div>
              </div>
             <hr>
          </div>
          <div class="row mt-2">
              <div class="col-12">
                <p><strong>Platform:</strong> 
                    <span id="url"></span>
                </p>
              </div>
          </div>
          <div class="row">
            <div class="col-6">
                <h6 class="text-center">Post Sended</h6>
                <p class="text-center" id="post_send">-</p>
            </div>
            <div class="col-6">
                <h6 class="text-center">Post Filtered</h6>
                <p class="text-center" id="post_filtered">-</p>

            </div>
            
          </div>
          <div class="row">
              <div class="col-12 pb-2">
                  <button class="btn btn-primary" id="bt">Scan</button>
              </div>
          </div>
        </div>
    </div>
<script src="popup.js"></script>
</body>
</html>
